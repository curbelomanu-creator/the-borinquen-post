name: Publish news from Google Sheet

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/publish-from-sheet.js'
      - 'scripts/generate-share-image.js'
      - 'tests/publisher.test.js'
      - '.github/workflows/publish-news.yml'
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Validate news publisher
        run: |
          node --check scripts/publish-from-sheet.js
          node --test tests/publisher.test.js

      - name: Generate posts from sheet
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_NAME: ${{ secrets.GOOGLE_SHEET_NAME }}
        run: npm run publish-from-sheet

      - name: Commit and push if there are generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # git status --porcelain quotes paths with spaces/accented characters.
          # Stage intended generated paths directly instead of parsing filenames.
          for generated_path in _posts assets/images/generated articles.json categories category static _pages; do
            if [ -e "$generated_path" ]; then
              git add -A -- "$generated_path"
            fi
          done

          if git diff --cached --quiet; then
            echo "No generated content changes to commit."
            exit 0
          fi

          git commit -m "chore: publish posts from Google Sheet"
          git pull --rebase origin main
          git push
